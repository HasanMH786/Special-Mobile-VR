<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>VeloVR Cinema</title>
<style>
  :root {
    --bg-oled: #000000;
    --surface: rgba(12, 18, 34, 0.88);
    --surface-card: rgba(20, 30, 54, 0.82);
    --border-subtle: rgba(120, 175, 255, 0.22);
    --accent-cyan: #00f0ff;
    --accent-violet: #8b5cf6;
    --accent-amber: #fbbf24;
    --accent-green: #22c55e;
    --accent-rose: #fb7185;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --ipd-offset: 0px;
    --screen-scale: 1;
    --barrel-radius: 26px;
    --vignette-opacity: 0.55;
    --dimmer-opacity: 0;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
    color: var(--text-main);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* ==================== LAUNCH VR OVERLAY ==================== */
  #launch-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: radial-gradient(circle at 50% 35%, #111c38 0%, #050811 58%, #000000 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  #launch-overlay.hidden {
    display: none;
  }

  .launch-card {
    width: min(540px, 94vw);
    background: rgba(10, 16, 30, 0.92);
    border: 1px solid rgba(0, 240, 255, 0.35);
    border-radius: 24px;
    padding: 24px 28px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 240, 255, 0.16);
  }

  .launch-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    border-radius: 999px;
    background: rgba(0, 240, 255, 0.12);
    border: 1px solid rgba(0, 240, 255, 0.3);
    color: var(--accent-cyan);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .launch-title {
    margin: 0 0 8px;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(120deg, #ffffff 10%, #00f0ff 55%, #a78bfa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .launch-sub {
    margin: 0 0 18px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-muted);
  }

  .launch-pills {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 20px;
  }

  .launch-pill {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #cbd5e1;
  }

  #btn-launch-vr {
    width: 100%;
    padding: 15px 22px;
    border: none;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.03em;
    color: #030712;
    background: linear-gradient(95deg, #00f0ff 0%, #38bdf8 50%, #a78bfa 100%);
    cursor: pointer;
    box-shadow: 0 0 28px rgba(0, 240, 255, 0.45);
    transition: transform 0.15s ease;
  }

  #btn-launch-vr:active {
    transform: scale(0.98);
  }

  /* ==================== 50/50 SBS STEREO STAGE ==================== */
  #vr-stage {
    position: fixed;
    inset: 0;
    display: flex;
    width: 100vw;
    height: 100vh;
    background: #000000;
    overflow: hidden;
    transform: translate3d(0, 0, 0);
  }

  .eye-panel {
    position: relative;
    width: 50%;
    height: 100%;
    overflow: hidden;
    background: #000000;
    transform: translate3d(0, 0, 0);
  }

  .eye-panel.left {
    border-right: 1px solid #050505;
  }

  /* Barrel distortion & optical lens mask */
  .eye-lens {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: var(--barrel-radius);
    background: #000000;
    transform: translate3d(0, 0, 0);
  }

  .eye-lens::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 80;
    border-radius: var(--barrel-radius);
    box-shadow: inset 0 0 42px rgba(0, 0, 0, var(--vignette-opacity));
    background: radial-gradient(circle at center, transparent 62%, rgba(0, 0, 0, calc(var(--vignette-opacity) * 0.85)) 100%);
  }

  /* OLED Theater Dimmer overlay */
  .theater-dimmer {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    background: rgba(0, 0, 0, var(--dimmer-opacity));
    transition: background 0.2s ease;
  }

  /* IPD Horizontal Shift Wrapper */
  .eye-ipd-layer {
    position: absolute;
    inset: 0;
    will-change: transform;
    transform: translate3d(0, 0, 0);
  }

  .eye-panel.left .eye-ipd-layer {
    transform: translate3d(calc(var(--ipd-offset) * 0.5), 0, 0);
  }

  .eye-panel.right .eye-ipd-layer {
    transform: translate3d(calc(var(--ipd-offset) * -0.5), 0, 0);
  }

  /* Head-Tracked World Plane (GPU accelerated translate3d) */
  .vr-world {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px;
    will-change: transform;
    backface-visibility: hidden;
    transform: translate3d(0, 0, 0) scale3d(var(--screen-scale), var(--screen-scale), 1);
    transform-origin: center center;
  }

  /* ==================== TOP-EDGE RE-ENABLE TRIGGER ==================== */
  .top-enable-bar {
    position: relative;
    z-index: 60;
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .enable-dot-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    border-radius: 999px;
    background: rgba(10, 16, 30, 0.82);
    border: 1px solid rgba(251, 191, 36, 0.35);
    color: #fde68a;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.03em;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.15s ease, border-color 0.2s ease, opacity 0.2s ease;
  }

  .enable-dot-btn.gaze-active-state {
    opacity: 0.45;
    border-color: rgba(148, 163, 184, 0.28);
    color: #94a3b8;
  }

  .enable-dot-btn.gaze-locked-state {
    opacity: 1;
    border-color: rgba(251, 191, 36, 0.85);
    box-shadow: 0 0 16px rgba(251, 191, 36, 0.32);
  }

  .enable-hold-fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 0%;
    background: linear-gradient(90deg, rgba(251, 191, 36, 0.35), rgba(0, 240, 255, 0.45));
    pointer-events: none;
  }

  /* ==================== CINEMA SCREEN FRAME (3 MODES) ==================== */
  .cinema-shell {
    position: relative;
    width: 93%;
    height: 83%;
    display: flex;
    flex-direction: column;
    border-radius: 14px;
    background: rgba(8, 13, 25, 0.92);
    border: 1px solid var(--border-subtle);
    box-shadow: 0 14px 45px rgba(0, 0, 0, 0.85), 0 0 24px rgba(0, 240, 255, 0.08);
    overflow: hidden;
    transition: border-radius 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
  }

  /* Mode 1: Flat Cinema */
  .vr-world.mode-flat .cinema-shell {
    border-radius: 10px;
    border-color: rgba(148, 163, 184, 0.3);
  }

  /* Mode 2: Curved IMAX Screen */
  .vr-world.mode-imax .cinema-shell {
    width: 97%;
    height: 85%;
    border-radius: 28px / 14px;
    border: 1.5px solid rgba(0, 240, 255, 0.42);
    box-shadow:
      0 0 40px rgba(0, 240, 255, 0.18),
      inset 0 0 28px rgba(56, 189, 248, 0.14);
    transform: perspective(680px) rotateX(1.5deg) scaleX(1.02);
  }

  /* Mode 3: 360 / 180 VR Dome */
  .vr-world.mode-dome360 .cinema-shell {
    width: 98%;
    height: 86%;
    border-radius: 26px;
    border: 1.5px solid rgba(167, 139, 250, 0.5);
    background: rgba(4, 7, 15, 0.65);
  }

  /* ==================== TOP HUD BAR ==================== */
  .hud-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    padding: 5px 7px;
    background: rgba(6, 10, 20, 0.94);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    z-index: 20;
    flex-shrink: 0;
  }

  .hud-group {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: nowrap;
  }

  .hud-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 5px 7px;
    min-height: 26px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-main);
    font-size: 9.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
  }

  .hud-btn.active {
    background: rgba(0, 240, 255, 0.18);
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
  }

  .hud-btn.mode-active {
    background: rgba(139, 92, 246, 0.28);
    border-color: #a78bfa;
    color: #ede9fe;
  }

  .hud-btn.danger-lock {
    background: rgba(251, 113, 133, 0.14);
    border-color: rgba(251, 113, 133, 0.42);
    color: #fecdd3;
  }

  .hud-btn.danger-lock.locked {
    background: rgba(251, 191, 36, 0.22);
    border-color: var(--accent-amber);
    color: #fef3c7;
  }

  /* Spatial D-Pad / WowMouse Focus Ring */
  .spatial-focused {
    outline: none !important;
    border-color: var(--accent-cyan) !important;
    box-shadow: 0 0 0 2px #00f0ff, 0 0 16px rgba(0, 240, 255, 0.65) !important;
    transform: scale(1.03);
    z-index: 10;
  }

  /* ==================== MAIN CONTENT AREA ==================== */
  .cinema-body {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    overflow: hidden;
  }

  .tab-pane {
    position: relative;
    flex: 1;
    display: none;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
    padding: 6px;
    gap: 6px;
  }

  .tab-pane.active {
    display: flex;
  }

  /* ==================== DEDICATED GAZE SCROLL RAIL ==================== */
  .gaze-scroll-rail {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 35;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .gaze-scroll-btn {
    width: 34px;
    height: 44px;
    border-radius: 11px;
    border: 1px solid rgba(0, 240, 255, 0.42);
    background: rgba(6, 12, 26, 0.86);
    color: var(--accent-cyan);
    font-size: 13px;
    font-weight: 800;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
  }

  .gaze-scroll-btn span {
    font-size: 7px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* ==================== YOUTUBE & VIDEO HUB ==================== */
  .search-row {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
  }

  .vr-input-box {
    flex: 1;
    min-width: 0;
    padding: 6px 9px;
    border-radius: 9px;
    background: rgba(15, 23, 42, 0.92);
    border: 1px solid rgba(148, 163, 184, 0.28);
    color: var(--text-main);
    font-size: 10.5px;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
  }

  .vr-input-box.placeholder {
    color: var(--text-muted);
  }

  .chip-row {
    display: flex;
    align-items: center;
    gap: 4px;
    overflow-x: auto;
    flex-shrink: 0;
    scrollbar-width: none;
  }

  .chip-row::-webkit-scrollbar {
    display: none;
  }

  .chip-btn {
    padding: 4px 9px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.06);
    color: #cbd5e1;
    font-size: 9.5px;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
  }

  .chip-btn.active {
    background: rgba(0, 240, 255, 0.2);
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
  }

  /* Player Stage inside YouTube/Local/360 */
  .player-stage {
    position: relative;
    width: 100%;
    height: 52%;
    min-height: 112px;
    border-radius: 10px;
    background: #000000;
    border: 1px solid rgba(255, 255, 255, 0.1);
    overflow: hidden;
    flex-shrink: 0;
  }

  .vr-world.player-expanded .player-stage {
    height: 76%;
  }

  .player-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
    background: #000000;
  }

  .player-layer.active {
    display: block;
  }

  .yt-frame-slot, .yt-frame-slot iframe {
    width: 100%;
    height: 100%;
    border: 0;
    background: #000;
  }

  .local-video-el, .mirror-canvas-el, .dome-canvas-el {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    display: block;
  }

  .dome-subtoggle {
    position: absolute;
    top: 6px;
    left: 6px;
    z-index: 25;
    display: none;
    gap: 4px;
  }

  .vr-world.mode-dome360 .dome-subtoggle {
    display: flex;
  }

  .player-controls-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    flex-wrap: nowrap;
    flex-shrink: 0;
    padding: 3px 0;
  }

  .video-grid {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px;
    padding-right: 40px;
    scrollbar-width: none;
  }

  .video-grid::-webkit-scrollbar {
    display: none;
  }

  .video-card {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 5px;
    border-radius: 9px;
    background: var(--surface-card);
    border: 1px solid rgba(255, 255, 255, 0.1);
    text-align: left;
    color: var(--text-main);
    cursor: pointer;
  }

  .video-thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 6px;
    overflow: hidden;
    background: #0f172a;
  }

  .video-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .video-badge {
    position: absolute;
    bottom: 3px;
    right: 3px;
    padding: 1px 4px;
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.8);
    color: var(--accent-cyan);
    font-size: 8px;
    font-weight: 800;
  }

  .video-title {
    font-size: 9.5px;
    font-weight: 700;
    line-height: 1.25;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .video-meta {
    font-size: 8px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ==================== WEB BROWSER HUB ==================== */
  .browser-toolbar {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  .browser-viewport {
    position: relative;
    flex: 1;
    min-height: 0;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: #0b1120;
    overflow: hidden;
  }

  .browser-iframe {
    width: 100%;
    height: 100%;
    border: 0;
    background: #ffffff;
  }

  .browser-reader {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    padding: 10px 44px 18px 12px;
    background: #070b14;
    color: #e2e8f0;
    font-size: 11px;
    line-height: 1.55;
    scrollbar-width: none;
  }

  .browser-reader::-webkit-scrollbar {
    display: none;
  }

  .browser-reader h3 {
    margin: 0 0 6px;
    font-size: 13px;
    color: var(--accent-cyan);
  }

  .browser-reader .reader-url {
    font-size: 8.5px;
    color: var(--text-muted);
    margin-bottom: 8px;
    word-break: break-all;
  }

  /* ==================== SETTINGS & CALIBRATION ==================== */
  .settings-scroll {
    flex: 1;
    overflow-y: auto;
    padding-right: 40px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    scrollbar-width: none;
  }

  .settings-scroll::-webkit-scrollbar {
    display: none;
  }

  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 9px;
    border-radius: 10px;
    background: var(--surface-card);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .setting-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-main);
  }

  .setting-sub {
    font-size: 8.5px;
    color: var(--text-muted);
  }

  .setting-controls {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .setting-val {
    min-width: 38px;
    text-align: center;
    font-size: 10px;
    font-weight: 800;
    color: var(--accent-cyan);
  }

  input[type="range"].vr-slider {
    width: 72px;
    accent-color: var(--accent-cyan);
  }

  /* ==================== VIRTUAL QWERTY KEYBOARD ==================== */
  .vk-overlay {
    position: absolute;
    left: 6px;
    right: 6px;
    bottom: 6px;
    z-index: 50;
    display: none;
    flex-direction: column;
    gap: 4px;
    padding: 6px;
    border-radius: 12px;
    background: rgba(5, 9, 18, 0.96);
    border: 1px solid rgba(0, 240, 255, 0.45);
    box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.9);
  }

  .vk-overlay.open {
    display: flex;
  }

  .vk-preview {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 4px 8px;
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.06);
    font-size: 10px;
    color: var(--accent-cyan);
    font-family: monospace;
  }

  .vk-row {
    display: flex;
    justify-content: center;
    gap: 3px;
  }

  .vk-key {
    flex: 1;
    min-width: 0;
    padding: 6px 2px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(30, 41, 59, 0.92);
    color: #f8fafc;
    font-size: 9.5px;
    font-weight: 700;
    text-align: center;
    cursor: pointer;
  }

  .vk-key.wide {
    flex: 1.7;
    background: rgba(51, 65, 85, 0.95);
  }

  .vk-key.primary {
    flex: 1.6;
    background: rgba(0, 240, 255, 0.22);
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
  }

  /* ==================== GAZE RETICLE & WOWMOUSE CURSOR ==================== */
  .gaze-reticle {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 28px;
    height: 28px;
    margin-left: -14px;
    margin-top: -14px;
    z-index: 90;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.15s ease;
  }

  .gaze-reticle.hidden-dot {
    opacity: 0;
    transform: scale(0.5);
  }

  .gaze-reticle svg {
    width: 28px;
    height: 28px;
    transform: rotate(-90deg);
  }

  .gaze-ring-bg {
    fill: none;
    stroke: rgba(255, 255, 255, 0.2);
    stroke-width: 2.5;
  }

  .gaze-ring-progress {
    fill: none;
    stroke: var(--accent-cyan);
    stroke-width: 2.8;
    stroke-linecap: round;
    stroke-dasharray: 69.115;
    stroke-dashoffset: 69.115;
  }

  .gaze-center-dot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 6px;
    height: 6px;
    margin-left: -3px;
    margin-top: -3px;
    border-radius: 50%;
    background: #00f0ff;
    box-shadow: 0 0 8px #00f0ff, 0 0 2px #ffffff;
  }

  /* Stereo Air Mouse / WowMouse Cursor */
  .air-cursor {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 16px;
    height: 16px;
    margin-left: -8px;
    margin-top: -8px;
    border-radius: 50%;
    border: 2px solid #ffffff;
    background: rgba(139, 92, 246, 0.55);
    box-shadow: 0 0 12px rgba(0, 240, 255, 0.9);
    z-index: 95;
    pointer-events: none;
    opacity: 0;
    will-change: transform, opacity;
  }

  .air-cursor.visible {
    opacity: 1;
  }

  /* Toast Banner inside VR Eyes */
  .vr-toast {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 92;
    padding: 5px 12px;
    border-radius: 999px;
    background: rgba(6, 12, 26, 0.92);

    opacity: 0;

  }

  /* Hidden local file picker */
  #local-video-input {
    display: none;
  }

  /* Offscreen / Embedded A-Frame host container (mounted only in 360 mode) */
  #aframe-host {
    position: fixed;
    left: -9999px;
    top: 0;
    width: 640px;
    height: 360px;
    overflow: hidden;
    pointer-events: none;
  }
</style>
</head>

  const eyeLeftEl = document.getElementById('eye-left');
  const eyeRightEl = document.getElementById('eye-right');
  eyeLeftEl.innerHTML = buildEyeMarkup('left');
  eyeRightEl.innerHTML = buildEyeMarkup('right');

  /* ==================== HELPERS FOR DUAL-EYE SYNC ==================== */
  function bothEyes(selector) {
    return Array.from(document.querySelectorAll(selector));
  }

  let toastTimer = null;
  function showToast(msg) {
    bothEyes('.vr-toast').forEach(el => {
      el.textContent = msg;
      el.classList.add('show');
    });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      bothEyes('.vr-toast').forEach(el => el.classList.remove('show'));
    }, 2000);
  }

  function applyCalibrationCSS() {
    const root = document.documentElement.style;
    root.setProperty('--ipd-offset', state.ipd + 'px');
    root.setProperty('--screen-scale', String(state.screenScale));
    const rad = Math.round((state.barrelPct / 100) * 44);
    root.setProperty('--barrel-radius', rad + 'px');
    root.setProperty('--vignette-opacity', (0.2 + (state.barrelPct / 100) * 0.65).toFixed(2));
    root.setProperty('--dimmer-opacity', (state.dimmerPct / 100).toFixed(2));

    bothEyes('[data-val="ipd"]').forEach(el => el.textContent = state.ipd + 'px');
    bothEyes('[data-val="scale"]').forEach(el => el.textContent = Math.round(state.screenScale * 100) + '%');
    bothEyes('[data-val="barrel"]').forEach(el => el.textContent = state.barrelPct + '%');
    bothEyes('[data-val="dimmer"]').forEach(el => el.textContent = state.dimmerPct + '%');

    bothEyes('input[data-setting="ipd"]').forEach(el => el.value = state.ipd);
    bothEyes('input[data-setting="scale"]').forEach(el => el.value = Math.round(state.screenScale * 100));
    bothEyes('input[data-setting="barrel"]').forEach(el => el.value = state.barrelPct);
    bothEyes('input[data-setting="dimmer"]').forEach(el => el.value = state.dimmerPct);
  }

  function renderVideoGrid() {
    const html = state.videos.map((v, idx) => `
      <button type="button"
        class="video-card spatial-box gaze-target ${v.id === state.currentVideoId ? 'active' : ''}"
        data-nav-id="vid-${idx}"
        data-action="play-yt"
        data-vid="${v.id}"
        data-is360="${v.is360 ? '1' : '0'}"
        data-title="${escapeAttr(v.title)}">
        <div class="video-thumb">
          <img src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt="${escapeAttr(v.title)}" loading="lazy" />
          <span class="video-badge">${v.is360 ? '360° VR' : 'HD'}</span>
        </div>
        <div class="video-title">${escapeHtml(v.title)}</div>
        <div class="video-meta">${escapeHtml(v.channel || 'YouTube')}</div>
      </button>
    `).join('');

    bothEyes('.video-grid').forEach(grid => {
      grid.innerHTML = html;
      grid.scrollTop = 0;
    });
  }

  function escapeHtml(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function escapeAttr(s) {
    return escapeHtml(s).replace(/'/g, '&#39;');
  }

  function syncTabsAndModes() {
    bothEyes('[data-action="tab"]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === state.activeTab);
    });
    bothEyes('.tab-pane').forEach(pane => {
      pane.classList.toggle('active', pane.dataset.pane === state.activeTab);
    });
    bothEyes('[data-action="screen-mode"]').forEach(btn => {
      btn.classList.toggle('mode-active', btn.dataset.mode === state.screenMode);
    });
    bothEyes('.vr-world').forEach(w => {
      w.classList.remove('mode-flat', 'mode-imax', 'mode-dome360');
      w.classList.add('mode-' + state.screenMode);
      w.classList.toggle('player-expanded', state.playerExpanded);
    });
    bothEyes('[data-action="dome-type"]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.dome === state.domeMode);
    });
    bothEyes('[data-action="yt-cat"]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.cat === state.youtubeCategory);
    });

    // Gaze lock UI sync
    bothEyes('.gaze-reticle').forEach(r => r.classList.toggle('hidden-dot', state.gazeDisabled));
    bothEyes('[data-action="disable-gaze"]').forEach(btn => {
      btn.classList.toggle('locked', state.gazeDisabled);
      btn.textContent = state.gazeDisabled ? 'Gaze Locked' : 'Disable Gaze';
    });
    bothEyes('[data-action="enable-gaze"]').forEach(btn => {
      btn.classList.toggle('gaze-active-state', !state.gazeDisabled);
      btn.classList.toggle('gaze-locked-state', state.gazeDisabled);
    });

    // Player layer visibility
    const showDome = state.screenMode === 'dome360' && state.playerSource !== 'youtube';
    const activeLayer = showDome ? 'dome' : state.playerSource;
    bothEyes('[data-player-layer]').forEach(layer => {
      layer.classList.toggle('active', layer.dataset.playerLayer === activeLayer);
    });

    syncFocusVisuals();
  }

  /* ==================== YOUTUBE IFRAME SYNC ENGINE ==================== */
  let ytApiLoaded = false;
  let ytLeft = null;
  let ytRight = null;
  let lastYtSync = 0;

  function loadYouTubeApi() {
    if (ytApiLoaded) return;
    ytApiLoaded = true;
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    tag.async = true;
    tag.onerror = () => {
      showToast('Offline: Use Local Video or 360° Dome');
    };
    document.head.appendChild(tag);
  }

  window.onYouTubeIframeAPIReady = () => {
    if (!window.YT || !YT.Player) return;
    const commonVars = {
      playsinline: 1,
      rel: 0,
      modestbranding: 1,
      iv_load_policy: 3,
      enablejsapi: 1,
      origin: window.location.origin
    };

    ytLeft = new YT.Player('yt-frame-left', {
      videoId: state.currentVideoId,
      playerVars: commonVars,
      events: {
        onReady: () => {
          try { ytLeft.setPlaybackQuality('medium'); } catch (_) {}
        },
        onStateChange: (ev) => {
          if (ev.data === YT.PlayerState.PLAYING) {
            state.isPlaying = true;
            if (ytRight && ytRight.playVideo) {
              try { ytRight.mute(); ytRight.playVideo(); } catch (_) {}
            }
          } else if (ev.data === YT.PlayerState.PAUSED) {
            state.isPlaying = false;
            if (ytRight && ytRight.pauseVideo) {
              try { ytRight.pauseVideo(); } catch (_) {}
            }
          }
        }
      }
    });

    ytRight = new YT.Player('yt-frame-right', {
      videoId: state.currentVideoId,
      playerVars: Object.assign({}, commonVars, { mute: 1 }),
      events: {
        onReady: () => {
          try {
            ytRight.mute();
            ytRight.setPlaybackQuality('small');
          } catch (_) {}
        }
      }
    });
  };

  function playYouTubeVideo(videoId, is360) {
    state.playerSource = 'youtube';
    state.currentVideoId = videoId;
    if (is360 && state.screenMode !== 'dome360') {
      setScreenMode('dome360');
    }
    syncTabsAndModes();

    if (ytLeft && ytLeft.loadVideoById) {
      ytLeft.loadVideoById(videoId);
      if (ytRight && ytRight.loadVideoById) {
        ytRight.mute();
        ytRight.loadVideoById(videoId);
      }
    } else {
      loadYouTubeApi();
    }
    showToast(is360 ? 'Playing 360° VR Video' : 'Loading YouTube Cinema');
  }

  function syncYouTubeStereoAndSpherical(now) {
    if (state.playerSource !== 'youtube' || !ytLeft || !ytLeft.getCurrentTime) return;
    if (now - lastYtSync > 600) {
      lastYtSync = now;
      if (ytRight && ytRight.getCurrentTime && ytRight.seekTo) {
        try {
          const tL = ytLeft.getCurrentTime();
          const tR = ytRight.getCurrentTime();
          if (Math.abs(tL - tR) > 0.35) {
            ytRight.seekTo(tL, true);
          }
          const stL = ytLeft.getPlayerState();
          const stR = ytRight.getPlayerState();
          if (stL === 1 && stR !== 1) { ytRight.mute(); ytRight.playVideo(); }
          if (stL === 2 && stR === 1) { ytRight.pauseVideo(); }
        } catch (_) {}
      }
    }
    // Drive 360° YouTube spherical view directly from phone gyroscope
    if (state.screenMode === 'dome360') {
      const yaw = (state.rawYaw - state.zeroYaw);
      const pitch = Math.max(-85, Math.min(85, state.rawPitch - state.zeroPitch));
      const props = { yaw: -yaw, pitch: pitch, roll: 0, fov: 100 };
      try {
        if (ytLeft.setSphericalProperties) ytLeft.setSphericalProperties(props);
        if (ytRight && ytRight.setSphericalProperties) ytRight.setSphericalProperties(props);
      } catch (_) {}
    }
  }

  /* ==================== YOUTUBE SEARCH (ANDROID BRIDGE + FALLBACK) ==================== */
  let searchSeq = 0;
  function runYouTubeSearch(query) {
    const trimmed = (query || '').trim();
    if (!trimmed) {
      state.videos = YOUTUBE_CATALOG[state.youtubeCategory].slice();
      renderVideoGrid();
      return;
    }

    // Check if user pasted a direct YouTube URL or 11-char ID
    const urlMatch = trimmed.match(/(?:v=|youtu\.be\/|shorts\/|^)([a-zA-Z0-9_-]{11})(?:[&?/]|$)/);
    if (urlMatch) {
      playYouTubeVideo(urlMatch[1], trimmed.toLowerCase().includes('360'));
      return;
    }

    showToast('Searching YouTube...');
    const cbId = 'yt_' + (++searchSeq);

    if (window.AndroidBridge && window.AndroidBridge.searchYouTube) {
      window.__ytPendingCb = cbId;
      window.AndroidBridge.searchYouTube(trimmed, cbId);
      return;
    }

    // Filter local catalog immediately as fallback
    const q = trimmed.toLowerCase();
    const all = Object.values(YOUTUBE_CATALOG).flat();
    const matched = all.filter(v => v.title.toLowerCase().includes(q) || v.channel.toLowerCase().includes(q));
    state.videos = matched.length ? matched : all.slice(0, 4);
    renderVideoGrid();
    showToast(matched.length ? `Found ${matched.length} videos` : 'Showing curated VR picks');
  }

  window.__onAndroidYouTubeSearch = (payload) => {
    if (!payload) return;
    if (payload.ok && Array.isArray(payload.results) && payload.results.length > 0) {
      state.videos = payload.results;
      renderVideoGrid();
      showToast(`Found ${payload.results.length} YouTube videos`);
    } else {
      const q = (state.youtubeQuery || '').toLowerCase();
      const all = Object.values(YOUTUBE_CATALOG).flat();
      const matched = all.filter(v => v.title.toLowerCase().includes(q));
      state.videos = matched.length ? matched : all.slice(0, 4);
      renderVideoGrid();
      showToast('Showing curated VR videos');
    }
  };

  /* ==================== LOCAL VIDEO + STEREO MIRROR ==================== */
  const localInput = document.getElementById('local-video-input');
  localInput.addEventListener('change', (ev) => {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    if (state.localVideoUrl) URL.revokeObjectURL(state.localVideoUrl);
    state.localVideoUrl = URL.createObjectURL(file);
    state.localVideoName = file.name;
    state.playerSource = 'local';
    state.activeTab = 'youtube';

    if (file.name.toLowerCase().includes('360') || file.name.toLowerCase().includes('vr')) {
      setScreenMode('dome360');
    }
    syncTabsAndModes();

    const vid = document.getElementById('master-video');
    vid.src = state.localVideoUrl;
    vid.play().catch(() => {});
    state.isPlaying = true;
    showToast('Playing: ' + file.name);
  });

  function mirrorLocalVideoFrame() {
    if (state.playerSource !== 'local' || state.screenMode === 'dome360') return;
    const vid = document.getElementById('master-video');
    const canvas = document.getElementById('mirror-video-canvas');
    if (!vid || !canvas || vid.readyState < 2) return;
    if (canvas.width !== 480 || canvas.height !== 270) {
      canvas.width = 480;
      canvas.height = 270;
    }
    const ctx = canvas.getContext('2d', { alpha: false });
    ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
  }

  /* ==================== LAZY A-FRAME 1.5.0 360° / 180° DOME ==================== */
  let aframeStatus = 'idle'; // 'idle' | 'loading' | 'ready' | 'fallback'
  let aframeSceneEl = null;

  function ensure360Engine() {
    if (state.screenMode !== 'dome360') return;
    if (aframeStatus === 'ready') {
      mountAFrameScene();
      return;
    }
    if (aframeStatus === 'loading' || aframeStatus === 'fallback') return;

    aframeStatus = 'loading';
    showToast('Loading 360° WebGL Engine...');
    const script = document.createElement('script');
    script.src = 'https://aframe.io/releases/1.5.0/aframe.min.js';
    script.async = true;
    script.onload = () => {
      aframeStatus = 'ready';
      if (state.screenMode === 'dome360') mountAFrameScene();
    };
    script.onerror = () => {
      aframeStatus = 'fallback';
      showToast('360° Lightweight Canvas Mode');
    };
    document.head.appendChild(script);
  }

  function mountAFrameScene() {
    const host = document.getElementById('aframe-host');
    if (aframeSceneEl) return;
    host.innerHTML = `
      <a-scene id="vr-aframe-scene" embedded vr-mode-ui="enabled: false"
        renderer="antialias: false; preserveDrawingBuffer: true; powerPreference: low-power;">
        <a-sky id="vr-aframe-sky" color="#050b18"></a-sky>
        <a-entity id="vr-aframe-stars"></a-entity>
        <a-videosphere id="vr-aframe-videosphere" visible="false"></a-videosphere>
        <a-entity id="vr-aframe-cam" camera="fov: 85" look-controls="enabled: false"></a-entity>
      </a-scene>
    `;
    aframeSceneEl = document.getElementById('vr-aframe-scene');
    // Populate lightweight starfield markers inside A-Frame scene
    const starsRoot = document.getElementById('vr-aframe-stars');
    if (starsRoot && window.AFRAME) {
      for (let i = 0; i < 36; i++) {
        const s = document.createElement('a-sphere');
        const theta = (i / 36) * Math.PI * 2;
        const phi = ((i % 5) - 2) * 0.42;
        const r = 18;
        s.setAttribute('position', `${(r * Math.cos(phi) * Math.cos(theta)).toFixed(2)} ${(r * Math.sin(phi)).toFixed(2)} ${(r * Math.cos(phi) * Math.sin(theta)).toFixed(2)}`);
        s.setAttribute('radius', i % 3 === 0 ? '0.16' : '0.09');
        s.setAttribute('color', i % 2 === 0 ? '#00f0ff' : '#a78bfa');
        starsRoot.appendChild(s);
      }
    }
  }

  function teardownAFrameScene() {
    const host = document.getElementById('aframe-host');
    if (aframeSceneEl) {
      host.innerHTML = '';
      aframeSceneEl = null;
    }
  }

  function renderDomeFrame(now) {
    if (state.screenMode !== 'dome360' || state.playerSource === 'youtube') return;
    const cL = document.getElementById('dome-canvas-left');
    const cR = document.getElementById('dome-canvas-right');
    if (!cL || !cR) return;
    if (cL.width !== 420) { cL.width = 420; cL.height = 240; cR.width = 420; cR.height = 240; }

    const vid = document.getElementById('master-video');
    const yawDeg = state.rawYaw - state.zeroYaw;
    const pitchDeg = Math.max(-80, Math.min(80, state.rawPitch - state.zeroPitch));

    // If A-Frame scene is active, rotate its camera & mirror its WebGL canvas into both eyes
    if (aframeStatus === 'ready' && aframeSceneEl && aframeSceneEl.canvas) {
      const cam = document.getElementById('vr-aframe-cam');
      const vs = document.getElementById('vr-aframe-videosphere');
      if (vs && vid && state.playerSource === 'local' && vid.readyState >= 2) {
        if (!vs.getAttribute('src')) vs.setAttribute('src', '#master-video');
        vs.setAttribute('visible', 'true');
        vs.setAttribute('phi-length', state.domeMode === '180' ? '180' : '360');
      }
      if (cam && cam.object3D) {
        cam.object3D.rotation.set(
          (pitchDeg * Math.PI) / 180,
          (-yawDeg * Math.PI) / 180,
          0,
          'YXZ'
        );
      }
      try {
        cL.getContext('2d').drawImage(aframeSceneEl.canvas, 0, 0, cL.width, cL.height);
        cR.getContext('2d').drawImage(aframeSceneEl.canvas, 0, 0, cR.width, cR.height);
        return;
      } catch (_) {}
    }

    // Ultra-lightweight Canvas 360/180 fallback (zero-crash offline guarantee)
    [cL, cR].forEach((canvas, eyeIdx) => {
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      if (state.playerSource === 'local' && vid && vid.readyState >= 2) {
        const panX = ((yawDeg % 360) / 360) * vid.videoWidth;
        ctx.drawImage(vid, 0, 0, vid.videoWidth, vid.videoHeight, -panX * 0.25, 0, w * 1.25, h);
      } else {
        const g = ctx.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, '#04091a');
        g.addColorStop(0.55, '#0b1838');
        g.addColorStop(1, '#02040a');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);

        // Panoramic horizon grid
        ctx.strokeStyle = 'rgba(0, 240, 255, 0.25)';
        ctx.lineWidth = 1;
        const offsetX = ((-yawDeg * 3.2) + (eyeIdx === 0 ? 4 : -4)) % 60;
        const offsetY = (pitchDeg * 1.8);
        for (let x = offsetX - 60; x < w + 60; x += 60) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, h);
          ctx.stroke();
        }
        for (let y = 20; y < h; y += 36) {
          ctx.beginPath();
          ctx.moveTo(0, y + (offsetY % 36));
          ctx.lineTo(w, y + (offsetY % 36));
          ctx.stroke();
        }
        ctx.fillStyle = '#00f0ff';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(
          `${state.domeMode}° VR DOME • YAW ${Math.round(yawDeg)}° • PITCH ${Math.round(pitchDeg)}°`,
          w / 2,
          h / 2
        );
        ctx.fillStyle = '#94a3b8';
        ctx.font = '10px sans-serif';
        ctx.fillText('Load a 360° YouTube or Local Video to project inside dome', w / 2, h / 2 + 18);
      }
    });
  }

  function setScreenMode(mode) {
    state.screenMode = mode;
    if (mode === 'dome360') {
      if (state.playerSource !== 'youtube' && state.playerSource !== 'local') {
        state.playerSource = 'dome';
      }
      ensure360Engine();
    } else {
      if (state.playerSource === 'dome') state.playerSource = 'youtube';
      teardownAFrameScene();
    }
    syncTabsAndModes();
    showToast(
      mode === 'flat' ? 'Flat Cinema (Web & Text)' :
      mode === 'imax' ? 'Curved IMAX Cinema' :
      `${state.domeMode}° VR Dome Mode`
    );
  }

  /* ==================== WEB BROWSER HUB (X-FRAME READER FALLBACK) ==================== */
  let webSeq = 0;
  function loadWebUrl(rawUrl, pushHistory = true) {
    let url = (rawUrl || '').trim();
    if (!url) return;
    if (!/^https?:\/\//i.test(url)) {
      if (url.includes('.') && !url.includes(' ')) url = 'https://' + url;
      else url = 'https://lite.duckduckgo.com/lite/?q=' + encodeURIComponent(url);
    }

    if (pushHistory) {
      state.browserHistory = state.browserHistory.slice(0, state.browserIndex + 1);
      state.browserHistory.push(url);
      state.browserIndex = state.browserHistory.length - 1;
    }

    bothEyes('[data-nav-id="web-url-input"]').forEach(el => {
      el.textContent = url;
      el.classList.remove('placeholder');
    });

    if (state.browserMode === 'iframe') {
      bothEyes('.browser-iframe').forEach(fr => {
        fr.style.display = 'block';
        fr.src = url;
      });
      bothEyes('.browser-reader').forEach(r => r.style.display = 'none');
      showToast('Loading Live Frame');
      return;
    }

    bothEyes('.browser-iframe').forEach(fr => fr.style.display = 'none');
    bothEyes('.browser-reader').forEach(r => {
      r.style.display = 'block';
      r.scrollTop = 0;
      r.querySelector('h3').textContent = 'Loading VR Reader...';
      r.querySelector('.reader-url').textContent = url;
      r.querySelector('.reader-content').textContent = 'Fetching page via X-Frame bypass...';
    });

    const cbId = 'web_' + (++webSeq);
    if (window.AndroidBridge && window.AndroidBridge.fetchPage) {
      window.AndroidBridge.fetchPage(url, cbId);
      return;
    }

    // Browser CORS/Reader fallback when running outside Android WebView
    fetch('https://r.jina.ai/' + url)
      .then(r => r.text())
      .then(txt => renderReaderContent(url, url, txt.slice(0, 12000)))
      .catch(() => {
        renderReaderContent(
          url,
          'Reader Preview (Offline / CORS Blocked)',
          'Website could not be fetched directly in browser preview. In the Android APK, native OkHttp Reader Mode bypasses X-Frame-Options automatically.\n\nRequested URL: ' + url
        );
      });
  }

  function renderReaderContent(url, title, text) {
    state.browserTitle = title || url;
    state.browserText = text || '';
    const paragraphs = state.browserText
      .split(/\n{2,}/)
      .filter(p => p.trim().length > 0)
      .slice(0, 60)
      .map(p => `<p style="margin:0 0 8px;">${escapeHtml(p.trim())}</p>`)
      .join('');

    bothEyes('.browser-reader').forEach(r => {
      r.querySelector('h3').textContent = state.browserTitle;
      r.querySelector('.reader-url').textContent = url;
      r.querySelector('.reader-content').innerHTML = paragraphs || '<p>No readable text found.</p>';
      r.scrollTop = 0;
    });
  }

  window.__onAndroidPageFetched = (payload) => {
    if (!payload) return;
    if (payload.ok) {
      renderReaderContent(payload.url, payload.title, payload.text);
      showToast('Loaded in VR Reader');
    } else {
      renderReaderContent(
        state.browserHistory[state.browserIndex],
        'Unable to Load Page',
        (payload.error || 'Connection error') + '\n\nTry toggling Reader / Frame mode.'
      );
    }
  };

  /* ==================== VIRTUAL QWERTY KEYBOARD ==================== */
  function openVirtualKeyboard(target) {
    state.vkTarget = target;
    state.vkBuffer = target === 'yt-search'
      ? state.youtubeQuery
      : (state.browserHistory[state.browserIndex] || '');
    state.vkOpen = true;
    updateVkPreview();
    bothEyes('.vk-overlay').forEach(el => el.classList.add('open'));
    syncFocusVisuals();
  }

  function closeVirtualKeyboard() {
    state.vkOpen = false;
    bothEyes('.vk-overlay').forEach(el => el.classList.remove('open'));
    syncFocusVisuals();
  }

  function updateVkPreview() {
    bothEyes('.vk-text').forEach(el => {
      el.textContent = state.vkBuffer || (state.vkTarget === 'yt-search' ? 'Type YouTube query...' : 'Type URL...');
    });
    if (state.vkTarget === 'yt-search') {
      state.youtubeQuery = state.vkBuffer;
      bothEyes('[data-nav-id="yt-search-input"]').forEach(el => {
        el.textContent = state.vkBuffer || 'Search YouTube or paste Video ID...';
        el.classList.toggle('placeholder', !state.vkBuffer);
      });
    } else {
      bothEyes('[data-nav-id="web-url-input"]').forEach(el => {
        el.textContent = state.vkBuffer || 'Enter URL...';
      });
    }
  }

  function handleVkKey(key) {
    if (key === 'CLOSE') {
      closeVirtualKeyboard();
      return;
    }
    if (key === 'BACK') {
      state.vkBuffer = state.vkBuffer.slice(0, -1);
      updateVkPreview();
      return;
    }
    if (key === 'CLEAR') {
      state.vkBuffer = '';
      updateVkPreview();
      return;
    }
    if (key === 'SPACE') {
      state.vkBuffer += ' ';
      updateVkPreview();
      return;
    }
    if (key === 'ENTER') {
      const val = state.vkBuffer;
      closeVirtualKeyboard();
      if (state.vkTarget === 'yt-search') {
        state.youtubeQuery = val;
        runYouTubeSearch(val);
      } else {
        loadWebUrl(val, true);
      }
      return;
    }
    state.vkBuffer += key;
    updateVkPreview();
  }

  /* ==================== DEDICATED GAZE SCROLL ==================== */
  function performScroll(dir) {
    const delta = dir * 130;
    const selector =
      state.activeTab === 'youtube' ? '[data-scroll-target="yt-grid"]' :
      state.activeTab === 'browser' ? '[data-scroll-target="browser-reader"]' :
      '[data-scroll-target="settings-scroll"]';

    bothEyes(selector).forEach(el => {
      el.scrollBy({ top: delta, behavior: 'smooth' });
    });
  }

  /* ==================== ACTION DISPATCHER ==================== */
  let lastClickTime = 0;
  function triggerElementAction(el) {
    if (!el) return;
    const now = performance.now();
    if (now - lastClickTime < 160) return;
    lastClickTime = now;

    if (el.dataset.navId) {
      state.focusedNavId = el.dataset.navId;
      syncFocusVisuals();
    }

    const action = el.dataset.action;
    switch (action) {
      case 'tab':
        state.activeTab = el.dataset.tab;
        closeVirtualKeyboard();
        syncTabsAndModes();
        break;
      case 'screen-mode':
        setScreenMode(el.dataset.mode);
        break;
      case 'dome-type':
        state.domeMode = el.dataset.dome;
        syncTabsAndModes();
        showToast(`${state.domeMode}° VR Dome`);
        break;
      case 'pick-local':
        localInput.click();
        break;
      case 'disable-gaze':
        state.gazeDisabled = !state.gazeDisabled;
        resetDwell();
        syncTabsAndModes();
        showToast(state.gazeDisabled ? 'Cinema Lock: Gaze Disabled' : 'Gaze Dot Enabled');
        break;
      case 'enable-gaze':
        state.gazeDisabled = false;
        resetDwell();
        syncTabsAndModes();
        showToast('Gaze Dot Re-Enabled');
        break;
      case 'open-vk':
        openVirtualKeyboard(el.dataset.vkTarget);
        break;
      case 'vk-key':
        handleVkKey(el.dataset.key);
        break;
      case 'yt-search-go':
        runYouTubeSearch(state.youtubeQuery);
        break;
      case 'yt-cat':
        state.youtubeCategory = el.dataset.cat;
        state.videos = (YOUTUBE_CATALOG[state.youtubeCategory] || []).slice();
        renderVideoGrid();
        syncTabsAndModes();
        break;
      case 'play-yt':
        playYouTubeVideo(el.dataset.vid, el.dataset.is360 === '1');
        break;
      case 'toggle-play':
        if (state.playerSource === 'local') {
          const vid = document.getElementById('master-video');
          if (vid.paused) { vid.play().catch(() => {}); state.isPlaying = true; }
          else { vid.pause(); state.isPlaying = false; }
        } else if (ytLeft && ytLeft.getPlayerState) {
          const st = ytLeft.getPlayerState();
          if (st === 1) {
            ytLeft.pauseVideo();
            if (ytRight && ytRight.pauseVideo) ytRight.pauseVideo();
          } else {
            ytLeft.playVideo();
            if (ytRight && ytRight.playVideo) { ytRight.mute(); ytRight.playVideo(); }
          }
        }
        break;
      case 'seek': {
        const delta = Number(el.dataset.delta || 0);
        if (state.playerSource === 'local') {
          const vid = document.getElementById('master-video');
          vid.currentTime = Math.max(0, (vid.currentTime || 0) + delta);
        } else if (ytLeft && ytLeft.getCurrentTime) {
          const target = Math.max(0, ytLeft.getCurrentTime() + delta);
          ytLeft.seekTo(target, true);
          if (ytRight && ytRight.seekTo) ytRight.seekTo(target, true);
        }
        showToast(delta > 0 ? `+${delta}s` : `${delta}s`);
        break;
      }
      case 'size-step':
        state.screenScale = Math.max(0.65, Math.min(1.35, +(state.screenScale + Number(el.dataset.delta)).toFixed(2)));
        applyCalibrationCSS();
        break;
      case 'ipd-step':
        state.ipd = Math.max(-30, Math.min(30, state.ipd + Number(el.dataset.delta)));
        applyCalibrationCSS();
        break;
      case 'barrel-step':
        state.barrelPct = Math.max(0, Math.min(100, state.barrelPct + Number(el.dataset.delta)));
        applyCalibrationCSS();
        break;
      case 'dim-step':
        state.dimmerPct = Math.max(0, Math.min(90, state.dimmerPct + Number(el.dataset.delta)));
        applyCalibrationCSS();
        break;
      case 'toggle-expand':
        state.playerExpanded = !state.playerExpanded;
        syncTabsAndModes();
        break;
      case 'recenter':
        state.zeroYaw = state.rawYaw;
        state.zeroPitch = state.rawPitch;
        state.smoothX = 0;
        state.smoothY = 0;
        showToast('View Recentered');
        break;
      case 'scroll-up':
        performScroll(-1);
        break;
      case 'scroll-down':
        performScroll(1);
        break;
      case 'web-open':
        loadWebUrl(el.dataset.url, true);
        break;
      case 'web-back':
        if (state.browserIndex > 0) {
          state.browserIndex--;
          loadWebUrl(state.browserHistory[state.browserIndex], false);
        }
        break;
      case 'web-fwd':
        if (state.browserIndex < state.browserHistory.length - 1) {
          state.browserIndex++;
          loadWebUrl(state.browserHistory[state.browserIndex], false);
        }
        break;
      case 'web-refresh':
        loadWebUrl(state.browserHistory[state.browserIndex], false);
        break;
      case 'web-mode-toggle':
        state.browserMode = state.browserMode === 'reader' ? 'iframe' : 'reader';
        bothEyes('[data-action="web-mode-toggle"]').forEach(b => {
          b.textContent = state.browserMode === 'reader' ? 'Reader' : 'Frame';
        });
        loadWebUrl(state.browserHistory[state.browserIndex], false);
        break;
    }
  }

  // Event delegation across both eyes (mouse / touch / WowMouse click)
  document.getElementById('vr-stage').addEventListener('click', (ev) => {
    const btn = ev.target.closest('[data-action]');
    if (btn) {
      ev.stopPropagation();
      triggerElementAction(btn);
    }
  });

  // Range sliders synced across both eyes
  document.getElementById('vr-stage').addEventListener('input', (ev) => {
    const slider = ev.target.closest('input[data-setting]');
    if (!slider) return;
    const key = slider.dataset.setting;
    const val = Number(slider.value);
    if (key === 'ipd') state.ipd = val;
    else if (key === 'scale') state.screenScale = val / 100;
    else if (key === 'barrel') state.barrelPct = val;
    else if (key === 'dimmer') state.dimmerPct = val;
    applyCalibrationCSS();
  });

  /* ==================== SPATIAL D-PAD & GAMEPAD ENGINE ==================== */
  function getVisibleSpatialBoxes() {
    const boxes = Array.from(eyeLeftEl.querySelectorAll('.spatial-box'));
    return boxes.filter(el => {
      const rect = el.getBoundingClientRect();
      return rect.width > 2 && rect.height > 2;
    });
  }

  function syncFocusVisuals() {
    bothEyes('.spatial-focused').forEach(el => el.classList.remove('spatial-focused'));
    if (!state.focusedNavId) return;
    bothEyes(`[data-nav-id="${state.focusedNavId}"]`).forEach(el => {
      el.classList.add('spatial-focused');
    });
  }

  function moveSpatialFocus(direction) {
    const candidates = getVisibleSpatialBoxes();
    if (!candidates.length) return;

    let current = candidates.find(el => el.dataset.navId === state.focusedNavId);
    if (!current) {
      state.focusedNavId = candidates[0].dataset.navId;
      syncFocusVisuals();
      return;
    }

    const curRect = current.getBoundingClientRect();
    const cx = curRect.left + curRect.width / 2;
    const cy = curRect.top + curRect.height / 2;

    let best = null;
    let bestScore = Infinity;

    for (const el of candidates) {
      if (el === current) continue;
      const r = el.getBoundingClientRect();
      const tx = r.left + r.width / 2;
      const ty = r.top + r.height / 2;
      const dx = tx - cx;
      const dy = ty - cy;

      let primary = 0;
      let secondary = 0;
      if (direction === 'ArrowRight') {
        if (dx <= 4) continue;
        primary = dx;
        secondary = Math.abs(dy);
      } else if (direction === 'ArrowLeft') {
        if (dx >= -4) continue;
        primary = -dx;
        secondary = Math.abs(dy);
      } else if (direction === 'ArrowDown') {
        if (dy <= 4) continue;
        primary = dy;
        secondary = Math.abs(dx);
      } else if (direction === 'ArrowUp') {
        if (dy >= -4) continue;
        primary = -dy;
        secondary = Math.abs(dx);
      }

      const score = primary + secondary * 2.4;
      if (score < bestScore) {
        bestScore = score;
        best = el;
      }
    }

    if (best) {
      state.focusedNavId = best.dataset.navId;
      syncFocusVisuals();
      best.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      // Keep right eye scroll container synced
      const leftGrid = eyeLeftEl.querySelector('.video-grid');
      const rightGrid = eyeRightEl.querySelector('.video-grid');
      if (leftGrid && rightGrid) rightGrid.scrollTop = leftGrid.scrollTop;
    }
  }

  function handleNavKey(key) {
    if (!state.launched) return;
    if (key === 'ArrowUp' || key === 'ArrowDown' || key === 'ArrowLeft' || key === 'ArrowRight') {
      moveSpatialFocus(key);
    } else if (key === 'Enter' || key === ' ') {
      const target = eyeLeftEl.querySelector(`.spatial-box[data-nav-id="${state.focusedNavId}"]`);
      if (target) triggerElementAction(target);
    } else if (key === 'Escape') {
      if (state.vkOpen) closeVirtualKeyboard();
    }
  }

  window.addEventListener('keydown', (ev) => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', ' ', 'Escape'].includes(ev.key)) {
      ev.preventDefault();
      handleNavKey(ev.key);
    }
  });

  window.__onNativeKey = (key) => {
    handleNavKey(key);
  };

  window.__onAndroidBack = () => {
    if (state.vkOpen) {
      closeVirtualKeyboard();
      return true;
    }
    if (state.activeTab === 'browser' && state.browserIndex > 0) {
      state.browserIndex--;
      loadWebUrl(state.browserHistory[state.browserIndex], false);
      return true;
    }
    if (state.activeTab !== 'youtube') {
      state.activeTab = 'youtube';
      syncTabsAndModes();
      return true;
    }
    return false;
  };

  // Bluetooth Gamepad Polling (in 60fps loop)
  let lastGamepadNav = 0;
  let lastGamepadA = false;
  function pollGamepad(now) {
    if (!navigator.getGamepads) return;
    const pads = navigator.getGamepads();
    const pad = pads && (pads[0] || pads[1]);
    if (!pad) return;

    const axX = pad.axes[0] || 0;
    const axY = pad.axes[1] || 0;
    const up = (pad.buttons[12] && pad.buttons[12].pressed) || axY < -0.55;
    const down = (pad.buttons[13] && pad.buttons[13].pressed) || axY > 0.55;
    const left = (pad.buttons[14] && pad.buttons[14].pressed) || axX < -0.55;
    const right = (pad.buttons[15] && pad.buttons[15].pressed) || axX > 0.55;
    const btnA = Boolean(pad.buttons[0] && pad.buttons[0].pressed);

    if (now - lastGamepadNav > 190) {
      if (up) { moveSpatialFocus('ArrowUp'); lastGamepadNav = now; }
      else if (down) { moveSpatialFocus('ArrowDown'); lastGamepadNav = now; }
      else if (left) { moveSpatialFocus('ArrowLeft'); lastGamepadNav = now; }
      else if (right) { moveSpatialFocus('ArrowRight'); lastGamepadNav = now; }
    }
    if (btnA && !lastGamepadA) {
      handleNavKey('Enter');
    }
    lastGamepadA = btnA;
  }

  /* ==================== STEREO WOWMOUSE / AIR CURSOR ==================== */
  window.addEventListener('pointermove', (ev) => {
    if (ev.pointerType === 'touch' && state.isDragging) return;
    const halfW = window.innerWidth * 0.5;
    const normX = (ev.clientX % halfW) / Math.max(1, halfW);
    const normY = ev.clientY / Math.max(1, window.innerHeight);
    state.airX = Math.max(0, Math.min(1, normX));
    state.airY = Math.max(0, Math.min(1, normY));
    state.airActive = true;

    bothEyes('.air-cursor').forEach(cur => {
      cur.classList.add('visible');
      cur.style.left = (state.airX * 100).toFixed(2) + '%';
      cur.style.top = (state.airY * 100).toFixed(2) + '%';
    });

    clearTimeout(state.airHideTimer);
    state.airHideTimer = setTimeout(() => {
      state.airActive = false;
      bothEyes('.air-cursor').forEach(cur => cur.classList.remove('visible'));
    }, 3000);
  });

  /* ==================== GYROSCOPE + TOUCH HEAD TRACKING ==================== */
  function handleOrientation(ev) {
    if (ev.alpha === null || ev.beta === null || ev.gamma === null) return;
    state.hasGyro = true;

    // Convert W3C DeviceOrientation (Z-X'-Y'') to continuous 3D look vector (-Z device axis)
    // Eliminates gimbal-lock jumps when pitching past vertical in VR headsets
    const deg2rad = Math.PI / 180;
    const a = ev.alpha * deg2rad;
    const b = ev.beta * deg2rad;
    const g = ev.gamma * deg2rad;

    const ca = Math.cos(a), sa = Math.sin(a);
    const cb = Math.cos(b), sb = Math.sin(b);
    const cg = Math.cos(g), sg = Math.sin(g);

    const vx = -ca * sg - sa * sb * cg;
    const vy = -sa * sg + ca * sb * cg;
    const vz = -cb * cg;

    const yaw = Math.atan2(vx, vy) / deg2rad;
    const pitch = Math.asin(Math.max(-1, Math.min(1, vz))) / deg2rad;

    if (state.zeroYaw === 0 && state.zeroPitch === 0 && state.rawYaw === 0 && state.rawPitch === 0) {
      state.zeroYaw = yaw;
      state.zeroPitch = pitch;
    }
    state.rawYaw = yaw;
    state.rawPitch = pitch;
  }

  function wrapAngleDelta(cur, zero) {
    let d = (cur - zero) % 360;
    if (d > 180) d -= 360;
    if (d < -180) d += 360;
    return d;
  }

  // Touch-drag fallback when testing on devices without gyro
  const stageEl = document.getElementById('vr-stage');
  stageEl.addEventListener('pointerdown', (ev) => {
    if (ev.target.closest('[data-action]') || ev.target.closest('input')) return;
    state.isDragging = true;
    state.dragStartX = ev.clientX;
    state.dragStartY = ev.clientY;
  });
  window.addEventListener('pointermove', (ev) => {
    if (!state.isDragging) return;
    const dx = ev.clientX - state.dragStartX;
    const dy = ev.clientY - state.dragStartY;
    state.dragStartX = ev.clientX;
    state.dragStartY = ev.clientY;
    state.rawYaw += dx * 0.22;
    state.rawPitch = Math.max(-85, Math.min(85, state.rawPitch - dy * 0.22));
  });
  window.addEventListener('pointerup', () => { state.isDragging = false; });

  /* ==================== GAZE DWELL + 2.5s TOP-EDGE RE-ENABLE ==================== */
  const RING_CIRCUMFERENCE = 69.115;
  let dwellNavId = null;
  let dwellStart = 0;
  let dwellCooldownUntil = 0;

  let enableHoldStart = 0;

  function resetDwell() {
    dwellNavId = null;
    dwellStart = 0;
    bothEyes('.gaze-ring-progress').forEach(c => {
      c.style.strokeDashoffset = String(RING_CIRCUMFERENCE);
    });
    bothEyes('.enable-hold-fill').forEach(f => { f.style.width = '0%'; });
  }

  function processGazeDwell(now) {
    if (!state.launched) return;
    if (now < dwellCooldownUntil) return;

    const rectLeft = eyeLeftEl.getBoundingClientRect();
    const cx = rectLeft.left + rectLeft.width * 0.5;
    const cy = rectLeft.top + rectLeft.height * 0.5;

    const hitEl = document.elementFromPoint(cx, cy);
    const target = hitEl && hitEl.closest('.spatial-box');

    // Special case: Top-Edge "Enable Dot (Hold 2.5s)" trigger ALWAYS listens when gaze is locked
    if (state.gazeDisabled) {
      if (target && target.dataset.navId === 'enable-dot-trigger') {
        if (!enableHoldStart) enableHoldStart = now;
        const pct = Math.min(1, (now - enableHoldStart) / state.enableHoldMs);
        bothEyes('.enable-hold-fill').forEach(f => { f.style.width = (pct * 100).toFixed(1) + '%'; });
        if (pct >= 1) {
          enableHoldStart = 0;
          dwellCooldownUntil = now + 700;
          triggerElementAction(target);
        }
      } else {
        enableHoldStart = 0;
        bothEyes('.enable-hold-fill').forEach(f => { f.style.width = '0%'; });
      }
      return;
    }

    if (!target || !target.classList.contains('gaze-target')) {
      resetDwell();
      return;
    }

    const navId = target.dataset.navId;
    if (navId !== dwellNavId) {
      dwellNavId = navId;
      dwellStart = now;
      state.focusedNavId = navId;
      syncFocusVisuals();
    }

    const elapsed = now - dwellStart;
    const progress = Math.min(1, elapsed / state.gazeDwellMs);
    bothEyes('.gaze-ring-progress').forEach(c => {
      c.style.strokeDashoffset = String(RING_CIRCUMFERENCE * (1 - progress));
    });

    if (progress >= 1) {
      // Continuous scroll for scroll buttons
      if (target.dataset.action === 'scroll-up' || target.dataset.action === 'scroll-down') {
        performScroll(target.dataset.action === 'scroll-up' ? -1 : 1);
        dwellStart = now - state.gazeDwellMs * 0.65;
        return;
      }
      resetDwell();
      dwellCooldownUntil = now + 650;
      triggerElementAction(target);
    }
  }

  /* ==================== 60FPS MASTER RENDER LOOP ==================== */
  function tick(now) {
    if (state.launched) {
      const yawDelta = wrapAngleDelta(state.rawYaw, state.zeroYaw);
      const pitchDelta = Math.max(-80, Math.min(80, state.rawPitch - state.zeroPitch));

      // Gentle head-tracking parallax for Flat/IMAX screen (expanded range reaches top-edge trigger)
      const targetX = Math.max(-220, Math.min(220, yawDelta * 2.8 * state.headSens));
      const targetY = Math.max(-220, Math.min(220, pitchDelta * 3.4 * state.headSens));
      state.smoothX += (targetX - state.smoothX) * 0.18;
      state.smoothY += (targetY - state.smoothY) * 0.18;

      const worldTransform = state.screenMode === 'dome360'
        ? `translate3d(0px, 0px, 0px) scale3d(${state.screenScale}, ${state.screenScale}, 1)`
        : `translate3d(${state.smoothX.toFixed(1)}px, ${state.smoothY.toFixed(1)}px, 0px) scale3d(${state.screenScale}, ${state.screenScale}, 1)`;

      bothEyes('.vr-world').forEach(w => {
        w.style.transform = worldTransform;
      });

      mirrorLocalVideoFrame();
      renderDomeFrame(now);
      syncYouTubeStereoAndSpherical(now);
      pollGamepad(now);
      processGazeDwell(now);
    }
    requestAnimationFrame(tick);
  }

  /* ==================== LAUNCH VR MODE ENTRY ==================== */
  document.getElementById('btn-launch-vr').addEventListener('click', async () => {
    try {
      if (window.AndroidBridge && window.AndroidBridge.enterVrMode) {
        window.AndroidBridge.enterVrMode();
      }
    } catch (_) {}

    try {
      const el = document.documentElement;
      if (el.requestFullscreen) await el.requestFullscreen();
    } catch (_) {}

    try {
      if (screen.orientation && screen.orientation.lock) {
        await screen.orientation.lock('landscape');
      }
    } catch (_) {}

    try {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        await DeviceOrientationEvent.requestPermission();
      }
    } catch (_) {}

    window.addEventListener('deviceorientation', handleOrientation, true);
    document.getElementById('launch-overlay').classList.add('hidden');
    state.launched = true;
    loadYouTubeApi();
    loadWebUrl(state.browserHistory[0], false);
    syncTabsAndModes();
    showToast('VR Mode Active • 60fps SBS');
  });

  // Initial population
  renderVideoGrid();
  applyCalibrationCSS();
  syncTabsAndModes();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
